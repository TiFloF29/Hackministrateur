<!-- Upgrade Bootstrap 5.3 -->
<!-- Simple-Jekyll-Search https://github.com/christian-fei/Simple-Jekyll-Search -->

<div class="input-group mt-5 px-3">
  <input id="search-input" type="text" class="form-control search-box" placeholder="Search posts..">
  <span class="input-group-text border border-primary bg-primary text-white">
    <i class="fa-solid fa-search"></i>
  </span>
  <button class="btn btn-outline-primary" onclick="location.href = '{{ '/blog/tags' | relative_url }}';">
    <i class="fa-solid fa-tags"></i>
  </button>
</div>
<ul class="list-group px-3" id="results-container"></ul>

<script src="https://cdn.jsdelivr.net/gh/christian-fei/Simple-Jekyll-Search@master/dest/simple-jekyll-search.min.js" integrity="sha384-UN+lyciv8Ta643YxZ9sY2tdTSmk3KE61Qq84ZIXG9NRTbD9+NFXy38m9h6Exxx3n" crossorigin="anonymous"></script>
<script>
  var sjs = SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('results-container'),
        searchResultTemplate: '<a href="{url}" class="list-group-item list-group-item-action">{title}</a>',
        noResultsText: '<li class="list-group-item list-group-item-action disabled">No results found</li>',
        json: '{{ '/search.json' | relative_url }}'
      });
</script>
